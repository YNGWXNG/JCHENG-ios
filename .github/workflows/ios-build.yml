name: iOS Build (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ========== 关键：安装 Flutter SDK（避免交互提示） ==========
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'   # 或 'stable'，但 Flet 内部会自己升级
          channel: 'stable'
          cache: true

      # 显式设置 FLUTTER_ROOT 环境变量（可选）
      - name: Set Flutter environment
        run: |
          echo "FLUTTER_ROOT=$HOME/flutter" >> $GITHUB_ENV
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter doctor -v

      # ========== 安装项目依赖 ==========
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet mysql-connector-python pillow requests pyzbar numpy

      # ========== 安装 CocoaPods（iOS 必须） ==========
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      # ========== 构建 IPA（自动确认所有提示） ==========
      - name: Build iOS IPA
        run: |
          # yes 命令自动输入 'y'，解决安装 Flutter 的交互式提示
          yes | flet build ipa --verbose

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ipa/*.ipa
          retention-days: 30
