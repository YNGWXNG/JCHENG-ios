name: iOS Build (Self-Test)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Set Flutter environment
        run: |
          echo "FLUTTER_ROOT=$HOME/flutter" >> $GITHUB_ENV
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter doctor -v

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet mysql-connector-python pillow requests pyzbar numpy

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      # ---------- 生成 iOS 项目（忽略签名失败） ----------
      - name: Generate iOS project with flet
        run: |
          yes | flet build ipa --verbose || true

      # ---------- 使用 xcodebuild 进行 Archive（强制自动签名，清除手动描述文件） ----------
      - name: Archive with xcodebuild
        working-directory: build/flutter/ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            archive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE=""

      # ---------- 导出 IPA ----------
      - name: Export IPA
        working-directory: build/flutter/ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

      # ---------- 上传 IPA ----------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-development
          path: build/flutter/ios/build/ipa/*.ipa
          retention-days: 30
