name: iOS Build (Self-Test)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Set Flutter environment
        run: |
          echo "FLUTTER_ROOT=$HOME/flutter" >> $GITHUB_ENV
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter doctor -v

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet mysql-connector-python pillow requests pyzbar numpy

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      # ========== 关键：执行 flet build，允许签名失败 ==========
      - name: Build Flet iOS app (generate project & archive)
        run: |
          yes | flet build ipa --verbose || echo "flet build failed but we will continue"
        # 尽管命令可能失败，但 .xcarchive 已经生成

      # ========== 查找已生成的 .xcarchive ==========
      - name: Locate .xcarchive
        id: find_archive
        run: |
          ARCHIVE_PATH=$(find . -name "*.xcarchive" -type d | head -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "No .xcarchive found, exit with error"
            exit 1
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV
          echo "Found archive at $ARCHIVE_PATH"

      # ========== 使用 xcodebuild 导出 IPA（自动签名） ==========
      - name: Export IPA with automatic signing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # 解锁钥匙串（避免弹出密码框）
          security unlock-keychain -p runner ~/Library/Keychains/login.keychain-db || true

          # 导出 exportOptions.plist
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          # 使用 xcodebuild 导出 IPA
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath ./build/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-development
          path: build/ipa/*.ipa
          retention-days: 30
